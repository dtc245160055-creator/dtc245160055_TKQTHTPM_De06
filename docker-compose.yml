version: '3.8'

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
  monitoring_net:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data:
  grafana_data:
  nginx_logs:

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: hotel_user
      POSTGRES_PASSWORD: StrongSecretPass123!
      POSTGRES_DB: hotel_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend_net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_tool
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@hotel.com
      PGADMIN_DEFAULT_PASSWORD: AdminSecure2026!
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - backend_net
      - frontend_net

  hotel_app:
    image: dtc245160055_tkqthtpm_de06-hotel_app:latest
    container_name: hotel_app
    restart: always
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: hotel_user
      DB_PASSWORD: StrongSecretPass123!
      DB_NAME: hotel_db
    volumes:
      - ./app/public:/usr/src/app/public
    depends_on:
      - postgres
    networks:
      - frontend_net
      - backend_net
      - monitoring_net

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - hotel_app
    networks:
      - frontend_net
      - monitoring_net

  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: prometheus_srv
    restart: always
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - monitoring_net

  grafana:
    image: grafana/grafana:10.2.0
    container_name: grafana_srv
    restart: always
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=GrafanaSecret2026!
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - monitoring_net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.0
    container_name: cadvisor_mon
    restart: always
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - monitoring_net

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:0.11.0
    container_name: nginx_exporter
    restart: always
    command:
      - -nginx.scrape-uri=https://nginx:443/stub_status
      - -nginx.ssl-verify=false
    networks:
      - monitoring_net

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: postgres_exporter
    restart: always
    environment:
      DATA_SOURCE_NAME: "postgresql://hotel_user:StrongSecretPass123!@postgres:5432/hotel_db?sslmode=disable"
    networks:
      - backend_net
      - monitoring_net
