version: '3.8'

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data:
  nginx_logs:

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: hotel_user
      POSTGRES_PASSWORD: StrongSecretPass123!
      POSTGRES_DB: hotel_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend_net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_tool
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@hotel.com
      PGADMIN_DEFAULT_PASSWORD: AdminSecure2026!
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - backend_net
      - frontend_net

  hotel_app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: hotel_app
    restart: always
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: hotel_user
      DB_PASSWORD: StrongSecretPass123!
      DB_NAME: hotel_db
    depends_on:
      - postgres
    networks:
      - frontend_net
      - backend_net

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - hotel_app
    networks:
      - frontend_net
