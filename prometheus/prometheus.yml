global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'hotel-app'
    static_configs:
      - targets: ['hotel_app:3000']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'nginx-exporter'
    static_configs:
      - targets: ['nginx-exporter:9113']
